map $http_upgrade $conexion { default upgrade; '' close; }
map $cookie_SolarUYInstancia $destino { default orden_a; a orden_a; b orden_b; }
upstream orden_a {
    zone orden_a 64k;
    server host.docker.internal:5051 max_fails=1 fail_timeout=2s;
    server host.docker.internal:5052 backup;
}
upstream orden_b {
    zone orden_b 64k;
    server host.docker.internal:5052 max_fails=1 fail_timeout=2s;
    server host.docker.internal:5051 backup;
}
server {
    listen 8080;
    large_client_header_buffers 4 32k;
    location / {
        proxy_pass http://$destino;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
